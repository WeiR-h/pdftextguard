name: Verify MoonBit source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, or blank for the selected branch
        required: false
        type: string
      release_check:
        description: Verify and package a release candidate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MoonBit toolchain
        env:
          MOONBIT_INSTALL_VERSION: '1.0.0-rc1+3c0520448'
        run: |
          export MOON_HOME="$RUNNER_TEMP/moonbit"
          installer="$RUNNER_TEMP/install-moonbit.sh"
          curl -fsSL --retry 3 -o "$installer" https://cli.moonbitlang.com/install/unix.sh
          bash "$installer" "$MOONBIT_INSTALL_VERSION"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
      - name: Check MoonBit source and pinned dependencies
        run: |
          git rev-parse HEAD
          moon version --all | tee "$RUNNER_TEMP/moon-version.txt"
          grep -Fq 'moon 0.1.20261126 ' "$RUNNER_TEMP/moon-version.txt"
          grep -Fq 'moonc v1.0.0-rc1+3c0520448 ' "$RUNNER_TEMP/moon-version.txt"
          python scripts/pin-mooncakes.py
          export MOON_WORK="$PWD/.work/moon.work"
          moon check --target js --frozen -p "$PWD"
          moon check --target js --frozen -p "$PWD/cmd/pdftextguard"
      - name: Test MoonBit and build the CLI
        shell: pwsh
        run: ./scripts/build.ps1 -Offline -Test -Python python
      - name: Replay CLI checks from the clean build
        run: |
          node verification/smoke.cjs
          node verification/quote_demo.cjs
          node verification/markdown_test.cjs
          node verification/suite_test.cjs
          python verification/page_results_test.py
      - name: Build and run the MoonBit library example
        run: python verification/moonbit_consumer_test.py --moon "$(command -v moon)"
      - name: Build and verify the release candidate
        if: inputs.release_check
        run: |
          python -m pip install -r verification/requirements.txt
          python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        if: inputs.release_check
        with:
          name: pdftextguard-release-candidate
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
