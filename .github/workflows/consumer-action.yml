name: Verify the published PDFTextGuard action
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published vMAJOR.MINOR.PATCH tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PDFTEXTGUARD_TAG: ${{ inputs.version || github.event.release.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        fixture: [subset-reordered, pdfkit-0.17.2-300, encrypted]
        include:
          - fixture: subset-reordered
            code: '0'
            result: pass
            step: success
          - fixture: pdfkit-0.17.2-300
            code: '1'
            result: regression
            step: failure
          - fixture: encrypted
            code: '2'
            result: inconclusive
            step: failure
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        shell: python
        run: |
          import os
          import re

          tag = os.environ["PDFTEXTGUARD_TAG"]
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){2}", tag):
              raise ValueError("Expected a stable numeric release tag")
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.PDFTEXTGUARD_TAG }}
          persist-credentials: false
      - name: Prepare PDFs with Unicode and spaces in their paths
        id: prepare
        shell: python
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          import os
          from pathlib import Path
          import shutil
          import sys

          sys.path.insert(0, "verification")
          from fetch_release import fetch

          tag = os.environ["PDFTEXTGUARD_TAG"]
          bundle = Path(os.environ["RUNNER_TEMP"]) / "consumer"
          fetch(tag, bundle)
          fixtures = bundle / f"PDFTextGuard-{tag}" / "verification/fixtures"
          exports = Path("PDF 导出")
          exports.mkdir()
          shutil.copyfile(fixtures / "pdfkit-0.18.0-300.pdf", exports / "基准 export.pdf")
          shutil.copyfile(fixtures / (os.environ["FIXTURE"] + ".pdf"), exports / "候选 export.pdf")
          if (fixtures.parent / "suite.cjs").is_file():
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as results:
                  results.write("batch-supported=true\n")
      - name: Invoke the published action by tag
        id: pdf
        continue-on-error: true
        uses: ./
        with:
          baseline: "PDF 导出/基准 export.pdf"
          candidate: "PDF 导出/候选 export.pdf"
          markdown-report: 'true'
      - name: Verify enforcement and retained outputs
        shell: python
        env:
          REPORT: ${{ steps.pdf.outputs.report-path }}
          MARKDOWN: ${{ steps.pdf.outputs.markdown-path }}
          OUTCOME: ${{ steps.pdf.outputs.outcome }}
          EXIT_CODE: ${{ steps.pdf.outputs.exit-code }}
          STEP_OUTCOME: ${{ steps.pdf.outcome }}
          EXPECTED_RESULT: ${{ matrix.result }}
          EXPECTED_CODE: ${{ matrix.code }}
          EXPECTED_STEP: ${{ matrix.step }}
        run: |
          import json
          import os
          import hashlib
          from pathlib import Path

          assert os.environ["OUTCOME"] == os.environ["EXPECTED_RESULT"]
          assert os.environ["EXIT_CODE"] == os.environ["EXPECTED_CODE"]
          assert os.environ["STEP_OUTCOME"] == os.environ["EXPECTED_STEP"]
          output = Path(os.environ["REPORT"])
          assert output.is_absolute()
          report = json.loads(output.read_text(encoding="utf-8"))
          assert report["outcome"] == os.environ["EXPECTED_RESULT"]
          assert report["exit_code"] == int(os.environ["EXPECTED_CODE"])
          assert report["tool_version"] == os.environ["PDFTEXTGUARD_TAG"][1:]
          markdown = Path(os.environ["MARKDOWN"])
          assert markdown.is_absolute() and markdown.parent == output.parent
          text = markdown.read_text(encoding="utf-8")
          assert f'**{report["outcome"]}** (exit {report["exit_code"]})' in text
          for name in ["基准 export.pdf", "候选 export.pdf"]:
              digest = hashlib.sha256((Path("PDF 导出") / name).read_bytes()).hexdigest()
              assert digest in text
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.pdf.outputs.report-path != '' }}
        with:
          name: report-${{ matrix.os }}-${{ matrix.fixture }}
          path: |
            ${{ steps.pdf.outputs.report-path }}
            ${{ steps.pdf.outputs.markdown-path }}
      - name: Prepare a mixed PDF suite
        if: matrix.fixture == 'subset-reordered' && steps.prepare.outputs.batch-supported == 'true'
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil

          tag = os.environ["PDFTEXTGUARD_TAG"]
          fixtures = Path(os.environ["RUNNER_TEMP"]) / "consumer" / f"PDFTextGuard-{tag}" / "verification/fixtures"
          exports = Path("PDF 导出")
          names = [
              ("回归 export.pdf", "qpdf-wrong-unicode.pdf"),
              ("加密 export.pdf", "encrypted.pdf"),
              ("候选 export.pdf", None),
          ]
          for name, fixture in names:
              if fixture:
                  shutil.copyfile(fixtures / fixture, exports / name)
          pairs = [{"id": name, "baseline": "基准 export.pdf", "candidate": name} for name, _ in names]
          (exports / "批量 清单.json").write_text(
              json.dumps({"schema_version": 1, "pairs": pairs}, ensure_ascii=False), encoding="utf-8"
          )
      - name: Invoke the published batch action
        if: matrix.fixture == 'subset-reordered' && steps.prepare.outputs.batch-supported == 'true'
        id: batch
        continue-on-error: true
        uses: ./
        with:
          pairs-file: "PDF 导出/批量 清单.json"
          markdown-report: 'true'
      - name: Verify batch enforcement and every saved report
        if: matrix.fixture == 'subset-reordered' && steps.prepare.outputs.batch-supported == 'true'
        shell: python
        env:
          REPORT_DIR: ${{ steps.batch.outputs.report-dir }}
          REPORT: ${{ steps.batch.outputs.report-path }}
          MARKDOWN: ${{ steps.batch.outputs.markdown-path }}
          OUTCOME: ${{ steps.batch.outputs.outcome }}
          EXIT_CODE: ${{ steps.batch.outputs.exit-code }}
          STEP_OUTCOME: ${{ steps.batch.outcome }}
        run: |
          import json
          import os
          from pathlib import Path

          assert os.environ["STEP_OUTCOME"] == "failure"
          assert os.environ["EXIT_CODE"] == "2" and os.environ["OUTCOME"] == "inconclusive"
          directory = Path(os.environ["REPORT_DIR"])
          report = Path(os.environ["REPORT"])
          markdown = Path(os.environ["MARKDOWN"])
          assert directory.is_absolute() and report.parent == markdown.parent == directory
          summary = json.loads(report.read_text(encoding="utf-8"))
          assert summary["tool_version"] == os.environ["PDFTEXTGUARD_TAG"][1:]
          assert summary["exit_code"] == 2 and summary["outcome"] == "inconclusive"
          assert [pair["exit_code"] for pair in summary["pairs"]] == [1, 2, 0]
          for pair in summary["pairs"]:
              saved = json.loads((directory / pair["report_path"]).read_text(encoding="utf-8"))
              assert saved["exit_code"] == pair["exit_code"]
              assert "SHA-256" in (directory / pair["markdown_path"]).read_text(encoding="utf-8")
          assert "inconclusive" in markdown.read_text(encoding="utf-8")
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.batch.outputs.report-dir != '' }}
        with:
          name: report-batch-${{ matrix.os }}
          path: ${{ steps.batch.outputs.report-dir }}
