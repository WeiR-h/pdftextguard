# Place this job after your exporter has created baseline.pdf and candidate.pdf.
name: PDF export gate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest # windows-latest also works
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the two exports
        id: pdf
        uses: WeiR-h/pdftextguard@v0.0.11
        with:
          baseline: baseline.pdf
          candidate: candidate.pdf
          markdown-report: 'true' # optional
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.pdf.outputs.report-path != '' }}
        with:
          name: pdftextguard-report
          path: |
            ${{ steps.pdf.outputs.report-path }}
            ${{ steps.pdf.outputs.markdown-path }}
